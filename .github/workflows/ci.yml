name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # prisma generate reads the datasource url from the schema; a dummy value
      # is enough since `generate` does not connect to the database.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Non-blocking for now: the repo has a large backlog of auto-fixable
      # biome format/import-order findings. Flip to a blocking step once a
      # one-time `npm run format` cleanup lands.
      - run: npm run lint
        continue-on-error: true
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: guideboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The integration global setup uses this service container instead of
      # spinning up testcontainers (which it does locally). It also seeds
      # DATABASE_URL for `prisma generate`.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/guideboard_test"
      DATABASE_URL_TEST: "postgresql://postgres:postgres@localhost:5432/guideboard_test"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:integration
